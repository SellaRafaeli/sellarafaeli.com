<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title description">
  <title id="title">Tracing an IDOR through a codebase</title>
  <desc id="description">An illustrative static analysis trace. An authenticated request for invoice 1042 passes through a route and controller to an unscoped lookup. The invoice is returned without checking whether the caller can read it. The dashed branch shows where an object authorization check could run.</desc>
  <style>
    .sans { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .label { fill:#b3c0d0; font-size:13px; letter-spacing:1.5px; }
    .code { fill:#edf3fa; font-size:15px; }
    .detail { fill:#b3c0d0; font-size:14px; }
    .node { fill:#172334; stroke:#40536a; }
    .trace { fill:none; stroke:#79e0cc; stroke-width:2; }
    .risk { stroke:#ffad8b; }
    .sweep { stroke-dasharray:100; animation:trace .55s ease-out both; animation-delay:var(--delay); }
    .highlight { animation:highlight 4.6s ease-in-out both; }
    @keyframes trace {
      from { stroke-dashoffset:100; }
      to { stroke-dashoffset:0; }
    }
    @keyframes highlight {
      0%, 58%, 100% { opacity:0; }
      77% { opacity:1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .highlight { animation:none; }
    }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#32435a" opacity=".55"/>
    </pattern>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#142032"/>
      <stop offset="1" stop-color="#0c131e"/>
    </linearGradient>
    <marker id="mint-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#79e0cc" stroke-width="1.3"/>
    </marker>
    <marker id="risk-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#ffad8b" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="959" height="509" rx="22" fill="url(#background)" stroke="#384b61"/>
  <rect x="24" y="166" width="912" height="244" fill="url(#grid)"/>

  <g class="mono">
    <circle cx="49" cy="43" r="4" fill="#79e0cc"/>
    <text x="63" y="48" fill="#79e0cc" font-size="13" letter-spacing="1.8">VARIABLEE / AI SAST</text>
    <text x="913" y="48" text-anchor="end" class="label">ILLUSTRATIVE CODE TRACE</text>
  </g>
  <g class="sans">
    <text x="44" y="107" fill="#f1f5fb" font-size="41" font-weight="680" letter-spacing="-1.5">Tracing an IDOR through a codebase</text>
    <text x="46" y="139" fill="#b3c0d0" font-size="17">Follow an object ID from the request to the response.</text>
  </g>
  <path d="M46 163H914" stroke="#3c4b60"/>

  <g fill="none" stroke="#52667e" stroke-width="2">
    <path d="M247 249H269 M469 249H491 M691 249H713"/>
  </g>
  <path class="trace sweep" d="M247 249H269" pathLength="100" style="--delay:.4s"/>
  <path class="trace sweep" d="M469 249H491" pathLength="100" style="--delay:1.35s"/>
  <path class="trace sweep risk" d="M691 249H713" pathLength="100" style="--delay:2.3s"/>
  <path class="trace" d="M257 249H266" marker-end="url(#mint-arrow)"/>
  <path class="trace" d="M479 249H488" marker-end="url(#mint-arrow)"/>
  <path class="trace risk" d="M701 249H710" marker-end="url(#risk-arrow)"/>
  <path d="M369 298V334H489" fill="none" stroke="#a2afc0" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="489" cy="334" r="3" fill="#a2afc0"/>

  <g class="mono">
    <g transform="translate(46 201)">
      <rect class="node" width="200" height="96" rx="10"/>
      <text x="15" y="25" class="label">01  REQUEST</text>
      <text x="15" y="53" class="code">GET /invoices/<tspan fill="#79e0cc">1042</tspan></text>
      <text x="15" y="77" class="detail sans">Signed-in caller</text>
    </g>
    <g transform="translate(268 201)">
      <rect class="node" width="200" height="96" rx="10"/>
      <text x="15" y="25" class="label">02  CONTROLLER</text>
      <text x="15" y="53" class="code">Invoices#show</text>
      <text x="15" y="77" class="detail sans">Reads the URL parameter</text>
    </g>
    <g transform="translate(490 201)">
      <rect class="node" width="200" height="96" rx="10"/>
      <text x="15" y="25" class="label">03  LOOKUP</text>
      <text x="15" y="53" class="code">Invoice.find(<tspan fill="#79e0cc">id</tspan>)</text>
      <text x="15" y="77" class="detail sans">Looks up by ID alone</text>
    </g>
    <g transform="translate(712 201)">
      <rect width="200" height="96" rx="10" fill="#2b2026" stroke="#c57c68"/>
      <rect class="highlight" width="200" height="96" rx="10" fill="none" stroke="#ffc2a6" stroke-width="3" opacity="0"/>
      <text x="15" y="25" class="label" style="fill:#ffbda2">04  RESPONSE</text>
      <text x="15" y="53" class="code">200 OK</text>
      <text x="15" y="77" class="detail sans" style="fill:#f3c7ba">Another user’s invoice</text>
    </g>
    <g transform="translate(504 320)">
      <text y="18" class="label">MISSING CHECK</text>
      <text y="44" class="code">Can this caller read invoice 1042?</text>
    </g>
  </g>

  <rect x="46" y="416" width="868" height="59" rx="10" fill="#251d23" stroke="#754c47"/>
  <path d="M65 452l8-15 8 15z M73 442v4 M73 448v1" fill="none" stroke="#ffad8b" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="94" y="451" class="mono" fill="#ffad8b" font-size="14" font-weight="bold">IDOR / BOLA</text>
  <path d="M204 432V459" stroke="#754c47"/>
  <text x="221" y="451" class="sans" fill="#f0dce0" font-size="16">A caller-controlled ID reaches the response without an object-level permission check.</text>
</svg>
